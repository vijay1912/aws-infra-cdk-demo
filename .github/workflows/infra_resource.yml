name: Deploy EC2 + NLB with CDK

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v3

      # Setup Node.js (for CDK CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'   # use stable LTS

      # Setup Python (for your CDK app)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install AWS CDK v2 (force v2, not latest)
      - name: Install AWS CDK v2
        run: npm install -g aws-cdk@2

      # Install Python dependencies
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cleanup old synth/context
      - name: Cleanup CDK context
        run: |
          rm -rf cdk.out
          rm -rf .cdk.context.json

      # Verify context flag is active
      - name: Verify CDK context
        run: cdk context

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   # adjust to your region

      # Bootstrap (first time only)
      - name: CDK Bootstrap
        run: cdk
