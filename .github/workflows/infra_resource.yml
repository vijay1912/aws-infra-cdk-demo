name: Deploy EC2 + NLB with CDK

on:
  push:
    branches:
      - main   # adjust if you want another branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v3

      # Setup Node.js (for CDK CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      # Setup Python (for your CDK app)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install CDK CLI
      - name: Install AWS CDK
        run: npm install -g aws-cdk

      # Install Python dependencies
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   # update to your region

      # Bootstrap (first time only)
      - name: CDK Bootstrap
        run: cdk bootstrap aws://547361936227/us-east-1

      # Deploy
      - name: CDK Deploy
        run: cdk deploy --require-approval never
