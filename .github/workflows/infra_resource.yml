name: Deploy EC2 + NLB with CDK

on:
  push:
    branches:
      - main   # adjust if you want another branch
  workflow_dispatch:   # allows manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'   # use stable LTS

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AWS CDK v2
        run: npm install -g aws-cdk@2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cleanup CDK context
        run: |
          rm -rf cdk.out
          rm -rf .cdk.context.json

      - name: Verify CDK context
        run: cdk context

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: CDK Bootstrap
        run: cdk bootstrap aws://547361936227/us-east-1

      - name: CDK Synth
        run: cdk synth

      - name: CDK Diff
        run: cdk diff

      - name: CDK Deploy
        run: cdk deploy --require-approval never
